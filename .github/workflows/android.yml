name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Check catalogue and updater
        run: |
          python3 tools/update_catalog.py --check
          python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Test, lint and build
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease :app:writeReleaseDependencies --no-daemon
      - name: Verify licenses and collect matching dependency sources
        run: python3 tools/dependency_sources.py fetch --report app/build/reports/release-dependencies.json
      - name: Package corresponding source
        run: python3 tools/package_source.py
      - name: Keep source archive
        uses: actions/upload-artifact@v7
        with:
          name: LumeTV-source-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: dist/*source.zip
      - name: Keep verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ github.sha }}
          retention-days: 14
          path: |
            app/build/reports/
            core/build/reports/
