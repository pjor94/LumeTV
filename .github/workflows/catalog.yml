name: Refresh bundled catalogue

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bundled-catalogue
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Fetch and validate WLTV data
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/update_catalog.py --refresh
          python3 tools/update_catalog.py --check
      - name: Commit only a changed, validated fallback
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- app/src/main/assets/channels.m3u catalog/source.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/channels.m3u catalog/source.json
          git commit -m 'chore: refresh bundled WLTV catalogue'
          git push origin "HEAD:$DEFAULT_BRANCH"
