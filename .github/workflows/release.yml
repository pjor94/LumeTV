name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.3.0-dev
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag, version and changelog
        run: python3 tools/release.py metadata
      - name: Check signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tools/release.py check-signing
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Validate catalogue and release tools
        run: |
          python3 tools/update_catalog.py --check
          python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Test and lint
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug --no-daemon
      - name: Build optimized APK and dependency manifest
        env:
          ORG_GRADLE_PROJECT_auraTrustedCertificateSha256: ${{ vars.AURA_TRUSTED_CERTIFICATE_SHA256 }}
        run: ./gradlew :app:assembleRelease :app:writeReleaseDependencies --no-daemon
      - name: Verify licenses and collect matching dependency sources
        run: python3 tools/dependency_sources.py fetch --report app/build/reports/release-dependencies.json
      - name: Sign and verify APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tools/release.py sign
      - name: Package source, notes and checksums
        run: python3 tools/release.py prepare
      - name: Keep release assets for publication
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Keep verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-verification-${{ github.run_id }}
          retention-days: 14
          overwrite: true
          path: |
            app/build/reports/
            core/build/reports/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-assets-${{ github.run_id }}
          path: dist/
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release.py publish
